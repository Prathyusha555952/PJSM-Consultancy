
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Free Session | PJSM</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .booking-page {
            background: #f5f7fa;
            padding: 60px 20px;
            min-height: 80vh;
        }

        .booking-container {
            max-width: 760px;
            margin: auto;
            background: #fff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,.08);
        }

        .booking-container h1 {
            color: #172b3a;
            margin-bottom: 12px;
            font-size: 34px;
        }

        .booking-container h1 span {
            color: #f4772b;
        }

        .booking-intro {
            color: #687786;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .booking-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-field.full-width {
            grid-column: 1 / -1;
        }

        .form-field label {
            color: #172b3a;
            font-weight: 600;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9e0e7;
            border-radius: 8px;
            font: inherit;
            box-sizing: border-box;
            background: #fff;
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: 2px solid #f4772b;
            border-color: #f4772b;
        }

        .booking-submit {
            grid-column: 1 / -1;
            background: #f4772b;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .booking-submit:hover {
            background: #dd621b;
        }

        .booking-note {
            grid-column: 1 / -1;
            color: #687786;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .booking-container {
                padding: 25px 18px;
            }

            .booking-container h1 {
                font-size: 27px;
            }

            .booking-form {
                grid-template-columns: 1fr;
            }

            .form-field.full-width,
            .booking-submit,
            .booking-note {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <!-- Keep your existing PJSM navbar here -->

    <main class="booking-page">
        <section class="booking-container">
            <h1>Book Your <span>Free Session</span></h1>

            <p class="booking-intro">
                Take the first step towards studying abroad.
                Share your details and our counselling team can
                help you explore your options.
            </p>

            <form class="booking-form"
                  action="https://formsubmit.co/YOUR_EMAIL@example.com"
                  method="POST">

                <input type="hidden" name="_subject"
                       value="New PJSM Free Counselling Booking">

                <input type="hidden" name="_captcha" value="true">

                <div class="form-field">
                    <label for="studentName">Full Name *</label>
                    <input id="studentName" name="Full Name"
                           type="text" required>
                </div>

                <div class="form-field">
                    <label for="studentEmail">Email Address *</label>
                    <input id="studentEmail" name="Email"
                           type="email" required>
                </div>

                <div class="form-field">
                    <label for="studentPhone">Phone Number *</label>
                    <input id="studentPhone" name="Phone"
                           type="tel" required
                           pattern="[+]?[0-9\s()-]{8,18}">
                </div>

                <div class="form-field">
                    <label for="destination">Preferred Country *</label>
                    <select id="destination" name="Preferred Country"
                            required>
                        <option value="">Select a country</option>
                        <option>Germany</option>
                        <option>United Kingdom</option>
                        <option>United States</option>
                        <option>Canada</option>
                        <option>Australia</option>
                        <option>Ireland</option>
                        <option>France</option>
                        <option>Other / Not sure</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="studyLevel">Study Level *</label>
                    <select id="studyLevel" name="Study Level" required>
                        <option value="">Select study level</option>
                        <option>Bachelor's</option>
                        <option>Master's</option>
                        <option>PhD</option>
                        <option>Diploma</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="sessionDate">Preferred Date *</label>
                    <input id="sessionDate" name="Preferred Date"
                           type="date" required>
                </div>

                <div class="form-field full-width">
                    <label for="sessionMode">Preferred Session Mode *</label>
                    <select id="sessionMode" name="Session Mode" required>
                        <option value="">Choose session mode</option>
                        <option>Online</option>
                        <option>Phone Call</option>
                        <option>In Person</option>
                    </select>
                </div>

                <div class="form-field full-width">
                    <label for="studentMessage">
                        Questions or Additional Details
                    </label>
                    <textarea id="studentMessage" name="Message"
                              rows="4"
                              placeholder="Tell us about your plans..."></textarea>
                </div>

                <p class="booking-note">
                    Submitting this form sends a booking request.
                    Your appointment is not confirmed until PJSM
                    contacts you.
                </p>

                <button class="booking-submit" type="submit">
                    Request My Free Session →
                </button>
            </form>
        </section>
    </main>

    <!-- Keep your existing PJSM footer here -->

</body>
</html>
